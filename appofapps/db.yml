apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb
spec:
  destination:
    namespace: dbtest
    server: https://kubernetes.default.svc
  source:
    path: ''
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: 28.1.5
    chart: mariadb
  sources: []
  project: training
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
